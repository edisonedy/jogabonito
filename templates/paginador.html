{% if paging.num_pages > 1 %}
  <nav class="mt-3">
    <ul class="pagination pagination-sm flex-wrap mb-0">
      {% if page.has_previous %}
        <li class="page-item">
          <a class="page-link" href="?{% if search %}s={{ search }}&amp;{% endif %}page={{ page.previous_page_number }}">&laquo;</a>
        </li>
      {% endif %}
      {% for p in rangospaging %}
        <li class="page-item {% if p == page.number %}active{% endif %}">
          <a class="page-link" href="?{% if search %}s={{ search }}&amp;{% endif %}page={{ p }}">{{ p }}</a>
        </li>
      {% endfor %}
      {% if page.has_next %}
        <li class="page-item">
          <a class="page-link" href="?{% if search %}s={{ search }}&amp;{% endif %}page={{ page.next_page_number }}">&raquo;</a>
        </li>
      {% endif %}
    </ul>
  </nav>
{% endif %}
